tsuru:
  pool:
    name: "default"

replicaCount: 1

podDisruptionBudget:
  enabled: false
  minAvailable: 1

prometheus:
  version: v2.30.0
  image:
    repository: quay.io/prometheus/prometheus

  alerting: {}
  # alertmanagers:
  # - apiVersion: v2
  #   name: alertmanager
  #   namespace: default
  #   pathPrefix: /
  #   port: web

service:
  type: ClusterIP
  annotations: {}

tickets:
  enabled: true

resources: {}

initContainers:
  - name: init-config-reloader
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 100Mi

containers:
  - name: config-reloader
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 100Mi

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "tsuru-prometheus-pool"

annotations: {}

podAnnotations: {}

volumeClaimTemplate:
  spec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
    storageClassName: standard

securityContext:
  fsGroup: 2000
  runAsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000

nameValidationScheme: Legacy

networkPolicy:
  enabled: true
  k8sAPIAddresses: []
  # - IPs of k8s-apiserver
  k8sAPIPorts: [80, 443]

  # additionalEgressRules:
  # - to:
  #   - namespaceSelector:
  #       matchLabels:
  #         name: myothernamespace


ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: default.mypool.io
  path: '/'
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute, an alternative to the Ingress above.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: my-gateway
  #   namespace: gateway-namespace
  # Attaching to the ListenerSet below instead of directly to a Gateway:
  # - group: gateway.networking.k8s.io
  #   kind: ListenerSet
  #   name: tsuru-prometheus-pool
  #   sectionName: https
  hostnames: []
  # - default.mypool.io
  path: /
  pathType: PathPrefix

# Gateway API ListenerSet, used to attach listeners (usually HTTPS ones, holding
# their own certificates) to a shared Gateway.
listenerSet:
  enabled: false
  # cert-manager can issue the listener certificate from these annotations.
  annotations: {}
  #  cert-manager.io/common-name: default.mypool.io
  #  cert-manager.io/issuer: globo-ca
  #  cert-manager.io/issuer-group: certify.globoi.com
  #  cert-manager.io/issuer-kind: CertifyProvider
  parentRef: {}
  #  name: gateway
  #  namespace: gitops-system
  #  group: gateway.networking.k8s.io
  #  kind: Gateway
  # Listeners default to port 443/HTTPS, tls mode Terminate and
  # allowedRoutes.namespaces.from Same.
  listeners: []
  # - name: https
  #   hostname: default.mypool.io
  #   tls:
  #     certificateRefs:
  #       - name: default-mypool-io-tls

rpaas:
  enabled: true
  # namespaceSelector:
  #  matchNames:
  #  - rpaasv2-fe
  #  - rpaasv2-be
  selector:
    matchLabels:
      'nginx.tsuru.io/app': nginx

  # Grants this pool's prometheus read access to the rpaas namespaces it
  # scrapes. The Role/RoleBinding pairs are created in those namespaces, not in
  # the release one.
  # The namespaces are the namespaceSelector.matchNames above, nothing is
  # created when that list is empty.
  reader:
    enabled: false
    # The Role is shared by every pool scraping the namespace, so its name has
    # no pool suffix. The RoleBinding is named <roleName>-pool-<pool name>.
    roleName: prometheus-reader
    # Extra namespaces that get only the RoleBinding, on top of the matchNames
    # ones. The Role there is expected to already exist, owned by whoever owns
    # the namespace.
    additionalBindingNamespaces: []
# additionalScrapeConfigs:
#   # Read more at: https://github.com/prometheus-operator/prometheus-operator/blob/master/Documentation/additional-scrape-config.md
#   name: additional-scrape-configs
#   key: prometheus-additional.yaml

# additionalAlertManagerConfigs:
#   # Read more at: https://github.com/prometheus-operator/prometheus-operator/blob/371192cdc95e4596c4f07591ff65104d8c85bad9/pkg/apis/monitoring/v1/types.go#L441
#   name: additional-alert-manager-configs
#   key: alert-manager-additional.yaml


# remoteWrite:
#   # Read more at: https://github.com/prometheus-operator/prometheus-operator/blob/371192cdc95e4596c4f07591ff65104d8c85bad9/pkg/apis/monitoring/v1/types.go#L215

# Kubernetes Tolerations to Prometheus CR (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/)
#
# e.g.
# tolerations:
# - key: dedicated
#   operator: Equal
#   value: prometheus
#   effect: NoSchedule
tolerations: []
