suite: test poddisruptionbudget
templates:
  - poddisruptionbudget.yaml
release:
  name: tsuru-prometheus-pool
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render with a single replica
    set:
      podDisruptionBudget.enabled: true
      replicaCount: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when disabled
    set:
      replicaCount: 3
      podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when there is more than one replica
    set:
      podDisruptionBudget.enabled: true
      replicaCount: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: metadata.name
          value: tsuru-prometheus-pool
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            prometheus: tsuru-prometheus-pool

  - it: should honor a custom minAvailable
    set:
      podDisruptionBudget.enabled: true
      replicaCount: 3
      podDisruptionBudget.minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
