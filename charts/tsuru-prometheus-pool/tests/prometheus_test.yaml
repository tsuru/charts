suite: test prometheus
templates:
  - prometheus.yaml
release:
  name: tsuru-prometheus-pool
tests:
  - it: should use the default securityContext
    asserts:
      - isKind:
          of: Prometheus
      - equal:
          path: spec.securityContext
          value:
            fsGroup: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 1000

  - it: should honor a custom securityContext
    set:
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
    asserts:
      - equal:
          path: spec.securityContext
          value:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
