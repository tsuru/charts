suite: test httproute
templates:
  - httproute.yaml
release:
  name: tsuru-prometheus-pool
tests:
  - it: should not render when disabled
    set:
      httpRoute.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render httproute with parentRefs and hostnames
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: my-gateway
          namespace: gateway-namespace
      httpRoute.hostnames:
        - default.mypool.io
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: tsuru-prometheus-pool
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-namespace
      - equal:
          path: spec.hostnames[0]
          value: default.mypool.io
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
      - equal:
          path: spec.rules[0].backendRefs[0].group
          value: ""
      - equal:
          path: spec.rules[0].backendRefs[0].kind
          value: Service
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: tsuru-prometheus-pool
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9090
      - equal:
          path: spec.rules[0].backendRefs[0].weight
          value: 1

  - it: should render with custom path and pathType
    set:
      httpRoute.enabled: true
      httpRoute.path: /metrics
      httpRoute.pathType: Exact
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: Exact
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /metrics

  - it: should render with annotations
    set:
      httpRoute.enabled: true
      httpRoute.annotations:
        custom.annotation/key: value
    asserts:
      - equal:
          path: metadata.annotations["custom.annotation/key"]
          value: value

  - it: should not render hostnames nor parentRefs when not set
    set:
      httpRoute.enabled: true
    asserts:
      - isNull:
          path: spec.hostnames
      - isNull:
          path: spec.parentRefs

  - it: should attach to a listenerset as parent
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: tsuru-prometheus-pool
          sectionName: https
    asserts:
      - equal:
          path: spec.parentRefs[0]
          value:
            group: gateway.networking.k8s.io
            kind: ListenerSet
            name: tsuru-prometheus-pool
            sectionName: https

  - it: should render multiple hostnames and parentRefs
    set:
      httpRoute.enabled: true
      httpRoute.hostnames:
        - foo.mypool.io
        - bar.mypool.io
      httpRoute.parentRefs:
        - name: gateway-a
          namespace: ns-a
        - name: gateway-b
          namespace: ns-b
    asserts:
      - equal:
          path: spec.hostnames
          value:
            - foo.mypool.io
            - bar.mypool.io
      - equal:
          path: spec.parentRefs
          value:
            - name: gateway-a
              namespace: ns-a
            - name: gateway-b
              namespace: ns-b

  - it: should use fullnameOverride in name and backendRef
    set:
      httpRoute.enabled: true
      fullnameOverride: custom-prometheus
    asserts:
      - equal:
          path: metadata.name
          value: custom-prometheus
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: custom-prometheus
