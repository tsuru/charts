suite: test rpaas reader rbac
templates:
  - rpaas-reader-rbac.yaml
release:
  name: tsuru-prometheus-pool
  namespace: tsuru-mypool
tests:
  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when rpaas is disabled
    set:
      rpaas.enabled: false
      rpaas.reader.enabled: true
      rpaas.namespaceSelector.matchNames:
        - rpaasv2-fe
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render without a namespaceSelector
    set:
      rpaas.reader.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render only the extra bindings without a namespaceSelector
    set:
      tsuru.pool.name: mypool
      rpaas.reader.enabled: true
      rpaas.reader.additionalBindingNamespaces:
        - tsuru-system
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: prometheus-reader-pool-mypool
      - equal:
          path: metadata.namespace
          value: tsuru-system

  - it: should render a role and a rolebinding per matchNames namespace
    set:
      tsuru.pool.name: mypool
      rpaas.reader.enabled: true
      rpaas.namespaceSelector.matchNames:
        - rpaasv2-fe
        - rpaasv2-be
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: prometheus-reader
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: rpaasv2-fe
        documentIndex: 0
      - equal:
          path: metadata.labels['app.kubernetes.io/part-of']
          value: pool
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - pods
                - services
                - endpoints
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - networking.k8s.io
              resources:
                - ingresses
              verbs:
                - get
                - list
                - watch
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: rpaasv2-be
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - equal:
          path: metadata.name
          value: prometheus-reader-pool-mypool
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: rpaasv2-fe
        documentIndex: 2
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: prometheus-reader
        documentIndex: 2
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: tsuru-prometheus-pool
              namespace: tsuru-mypool
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: rpaasv2-be
        documentIndex: 3

  - it: should bind on the additional namespaces on top of matchNames
    set:
      rpaas.reader.enabled: true
      rpaas.namespaceSelector.matchNames:
        - rpaasv2-fe
      rpaas.reader.additionalBindingNamespaces:
        - tsuru-system
        - rpaasv2-be
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: rpaasv2-fe
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: tsuru-system
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: rpaasv2-be
        documentIndex: 3

  - it: should not duplicate a namespace listed both in matchNames and in the additional ones
    set:
      rpaas.reader.enabled: true
      rpaas.namespaceSelector.matchNames:
        - rpaasv2-fe
      rpaas.reader.additionalBindingNamespaces:
        - rpaasv2-fe
    asserts:
      - hasDocuments:
          count: 2

  - it: should honor a custom role name
    set:
      tsuru.pool.name: mypool
      rpaas.reader.enabled: true
      rpaas.reader.roleName: my-reader
      rpaas.namespaceSelector.matchNames:
        - rpaasv2-fe
    asserts:
      - equal:
          path: metadata.name
          value: my-reader
        documentIndex: 0
      - equal:
          path: metadata.name
          value: my-reader-pool-mypool
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: my-reader
        documentIndex: 1
