suite: test httproute
templates:
  - httproute.yaml
release:
  name: rpaas-purger
tests:
  - it: should not render when disabled
    set:
      httpRoute.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render httproute with parentRefs and hostnames
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: my-gateway
          namespace: gateway-namespace
      httpRoute.hostnames:
        - example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: rpaas-purger
      - equal:
          path: spec.parentRefs[0].name
          value: my-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-namespace
      - equal:
          path: spec.hostnames[0]
          value: example.com
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: rpaas-purger
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80

  - it: should render with custom path and pathType
    set:
      httpRoute.enabled: true
      httpRoute.path: /api
      httpRoute.pathType: Exact
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: Exact
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api

  - it: should render with annotations
    set:
      httpRoute.enabled: true
      httpRoute.annotations:
        custom.annotation/key: value
    asserts:
      - equal:
          path: metadata.annotations["custom.annotation/key"]
          value: value

  - it: should not render hostnames when not set
    set:
      httpRoute.enabled: true
    asserts:
      - isNull:
          path: spec.hostnames

  - it: should not render parentRefs when not set
    set:
      httpRoute.enabled: true
    asserts:
      - isNull:
          path: spec.parentRefs

  - it: should render multiple hostnames
    set:
      httpRoute.enabled: true
      httpRoute.hostnames:
        - foo.example.com
        - bar.example.com
    asserts:
      - equal:
          path: spec.hostnames
          value:
            - foo.example.com
            - bar.example.com

  - it: should render multiple parentRefs
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: gateway-a
          namespace: ns-a
        - name: gateway-b
          namespace: ns-b
    asserts:
      - equal:
          path: spec.parentRefs
          value:
            - name: gateway-a
              namespace: ns-a
            - name: gateway-b
              namespace: ns-b

  - it: should use fullnameOverride in name and backendRef
    set:
      httpRoute.enabled: true
      fullnameOverride: custom-purger
    asserts:
      - equal:
          path: metadata.name
          value: custom-purger
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: custom-purger
